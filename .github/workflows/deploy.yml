name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for mvnw
        run: chmod +x mvnw
      - name: Build
        run: ./mvnw package -DskipTests
      - name: Test
        run: echo "Tests skipped - no database in CI"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install & Build
        run: cd grain-frontend && npm ci && npm run build

  healthcheck:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Healthcheck API
        run: curl -f https://grain-api.onrender.com/actuator/health
      - name: Healthcheck Frontend
        run: curl -f https://grain-frontend.onrender.com