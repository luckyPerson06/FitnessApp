name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Grant mvnw permissions
        run: chmod +x mvnw

      - name: Build
        run: |
          ./mvnw compile -DskipTests
          cd grain-frontend && npm ci && npm run build

      - name: Test
        run: ./mvnw test -Dspring.profiles.active=test

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}"
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}"

  healthcheck:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render deploy
        run: sleep 90

      - name: Healthcheck
        run: |
          curl -f https://grain-api.onrender.com/actuator/health
          curl -f https://grain-frontend.onrender.com